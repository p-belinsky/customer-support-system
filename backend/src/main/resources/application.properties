spring.application.name=backend

# Real local values live in application-secrets.properties (gitignored), imported here so
# `./mvnw spring-boot:run` keeps working unchanged. In Render, real env vars take over and this
# optional import silently no-ops (the file doesn't exist in the deployed image).
spring.config.import=optional:file:./application-secrets.properties

server.port=${PORT:8080}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:support_system}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:true}

spring.security.user.name=${ADMIN_USERNAME:admin}
spring.security.user.password=${ADMIN_PASSWORD_HASH:{bcrypt}$2a$10$wT3AhK.itawGBYO7mf6m9OkWskynEn2sPkdxAz0/nSfNVTzv/ZsLK}

sendgrid.api-key=${SENDGRID_API_KEY:}
sendgrid.from-address=${SENDGRID_FROM_ADDRESS:support@philbelinsky.com}
sendgrid.inbound-reply-domain=${SENDGRID_INBOUND_REPLY_DOMAIN:inbound.philbelinsky.com}
sendgrid.webhook.secret=${SENDGRID_WEBHOOK_SECRET:}

spring.ai.google.genai.api-key=${GOOGLE_GENAI_API_KEY:}
spring.ai.google.genai.chat.model=${GOOGLE_GENAI_CHAT_MODEL:gemini-3.5-flash-lite}

# Cross-origin session cookie (frontend is a separate Render Static Site origin in prod).
# Defaults keep local dev working: Vite proxies same-origin, so Lax + non-secure is fine there.
server.servlet.session.cookie.same-site=${COOKIE_SAME_SITE:Lax}
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

# Comma-separated list of origins allowed to call the API with credentials.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
