# Render Blueprint for the customer-support-system.
# Deploy via https://dashboard.render.com/blueprints -> New Blueprint Instance, pointing at this repo.
#
# Two-service architecture: a Static Site for the frontend and a separate Web Service for the
# backend, talking cross-origin over CORS with credentialed (cookie-based) session auth.
#
# NOTE: CORS_ALLOWED_ORIGINS and VITE_API_BASE_URL below assume the default service names in this
# file produce URLs of the form https://<service-name>.onrender.com. If you rename a service in the
# Render dashboard, update the corresponding URL below and redeploy.

databases:
  - name: customer-support-db
    plan: free

services:
  - type: web
    name: customer-support-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: customer-support-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: customer-support-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: customer-support-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: customer-support-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: customer-support-db
          property: password
      - key: JPA_SHOW_SQL
        value: "false"
      - key: COOKIE_SAME_SITE
        value: None
      - key: COOKIE_SECURE
        value: "true"
      - key: CORS_ALLOWED_ORIGINS
        value: https://customer-support-frontend.onrender.com
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: SENDGRID_FROM_ADDRESS
        sync: false
      - key: SENDGRID_INBOUND_REPLY_DOMAIN
        sync: false
      - key: SENDGRID_WEBHOOK_SECRET
        sync: false
      - key: GOOGLE_GENAI_API_KEY
        sync: false

  - type: web
    name: customer-support-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://customer-support-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
